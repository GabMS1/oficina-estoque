<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Novo Produto - Estoque</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="navbar">
        <a href="/">Visão Geral</a>
        <a href="/nova_movimentacao">Registrar Movimentação</a>
        <a href="/novo_produto">Cadastrar Produto</a>
    </div>

    <div class="container">
        <h1>Cadastrar Novo Produto</h1>
        
        <div class="form-container">
            <form action="/salvar_produto" method="POST">
                <div class="form-group" style="flex-direction: column; align-items: flex-start;">
                    
                    <label>Nome do Produto:</label>
                    <input type="text" name="nome" required style="width: 100%; margin-bottom: 10px;">
                    
                    <label>Categoria:</label>
                    <input type="text" name="categoria_nome" placeholder="Ex: Tinta, Ferramenta..." required style="width: 100%; margin-bottom: 10px;">

                    <label>Marca:</label>
                    <input type="text" name="marca_nome" placeholder="Ex: Suvinil, Bosch..." required style="width: 100%; margin-bottom: 10px;">

                    <div style="display: flex; gap: 20px; width: 100%;">
                        <div style="flex: 1;">
                            <label>Preço de Custo (R$):</label>
                            <input type="number" step="0.01" name="preco_custo" required style="width: 100%;">
                        </div>
                        <div style="flex: 1;">
                            <label>Preço de Venda (R$):</label>
                            <input type="number" step="0.01" name="preco_venda" required style="width: 100%;">
                        </div>
                    </div>
                    
                    <br>
                    <button type="submit" style="width: 100%;">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
