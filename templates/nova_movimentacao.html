<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Movimentação</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', q=2) }}">
</head>
<body>
    <div class="container">
        <h2>Registrar Nova Movimentação</h2>
        
        <form action="/movimentar" method="POST">
            
            <div class="form-group">
                <label>Selecione a Peça:</label>
                <select name="produto_id" required>
                    <option value="">-- Escolha uma peça --</option>
                    {% for p in produtos %}
                        <option value="{{ p.id }}">{{ p.nome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Tipo de Movimentação:</label>
                <select name="tipo" required>
                    <option value="ENTRADA">Entrada (Chegou peça)</option>
                    <option value="SAIDA">Saída (Usou na oficina)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Quantidade:</label>
                <input type="number" name="quantidade" required placeholder="Ex: 5">
            </div>

            <div class="form-group">
                <label>Valor Unitário (R$):</label>
                <input type="number" step="0.01" name="valor_unitario" placeholder="Ex: 12.50" value="0.00">
            </div>

            <div class="form-group">
                <label>Motivo (OS / Veículo / Destino):</label>
                <input type="text" name="motivo" required placeholder="Ex: Saiu 2 tintas para o caminhão da água">
            </div>

            <button type="submit" class="btn-submit">Confirmar Movimentação</button>
        </form>
        
        <br>
        <div style="text-align: center;">
            <a href="/" class="btn-submit" style="background-color: #666; text-decoration: none; display: inline-block; width: 100%; box-sizing: border-box;">Voltar para o Estoque</a>
        </div>
    </div>
</body>
</html>
